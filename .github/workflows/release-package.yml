name: Release package

on:
  workflow_call:
    inputs:
      tag:
        description: Stable release tag to package
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to package
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      upstream_version: ${{ steps.version.outputs.upstream_version }}
      version: ${{ steps.version.outputs.version }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.2'
          extensions: curl, ftp, gd, mbstring, openssl, pdo, sockets, ssh2
          tools: composer:v2
          coverage: none

      - name: Verify release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]]; then
            echo "Release tag is not a supported fork version: $RELEASE_TAG" >&2
            exit 1
          fi

          git tag --points-at HEAD | grep -Fx "$RELEASE_TAG"
          APP_VERSION="$(sed -n "s/.*'fork_version'[[:space:]]*=>[[:space:]]*'\([^']*\)'.*/\1/p" config/app.php | head -n 1)"
          if [[ "$VERSION" != "$APP_VERSION" ]]; then
            echo "Tag $VERSION does not match app release version $APP_VERSION" >&2
            exit 1
          fi

          if [[ -f .github/upstream-release ]]; then
            UPSTREAM_TAG="$(tr -d '\r\n' < .github/upstream-release)"
            UPSTREAM_VERSION="${UPSTREAM_TAG#[vV]}"
          else
            UPSTREAM_VERSION="${VERSION%.*}"
          fi
          if [[ ! "$UPSTREAM_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Upstream version metadata is invalid: $UPSTREAM_VERSION" >&2
            exit 1
          fi

          echo "artifact_name=dnsmgr-release-${VERSION}" >> "$GITHUB_OUTPUT"
          echo "upstream_version=${UPSTREAM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify stable branch ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/stable/*:refs/remotes/origin/stable/*'
          if ! git branch -r --contains HEAD | grep -Eq 'origin/stable/'; then
            echo 'Release tag must point to a stable branch commit' >&2
            exit 1
          fi

      - name: Run regression tests
        shell: bash
        run: |
          set -euo pipefail
          php tests/CertDnsUtilsCnameConflictTest.php
          php tests/UpdateUtilsTest.php
          find app config route tests -type f -name '*.php' -print0 \
            | sort -z \
            | xargs -0 -r -n 1 php -l > /dev/null

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Build installation package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          mkdir -p dist
          zip -q -r "dist/dnsmgr_${VERSION}.zip" . \
            -x '.git/*' '.github/*' 'tests/*' 'dist/*' '.env'
          (
            cd dist
            sha256sum "dnsmgr_${VERSION}.zip" > "dnsmgr_${VERSION}.zip.sha256"
          )

      - name: Verify installation package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          PACKAGE="dist/dnsmgr_${VERSION}.zip"
          (
            cd dist
            sha256sum -c "dnsmgr_${VERSION}.zip.sha256"
          )
          unzip -tq "$PACKAGE"
          zipinfo -1 "$PACKAGE" | grep -qx 'app/utils/CertDnsUtils.php'
          zipinfo -1 "$PACKAGE" | grep -qx 'vendor/autoload.php'
          if zipinfo -1 "$PACKAGE" | grep -Eq '^(\.git|\.github|tests|dist)/|^\.env$'; then
            echo 'Installation package contains excluded files' >&2
            exit 1
          fi

      - name: Upload verified package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            dist/dnsmgr_${{ steps.version.outputs.version }}.zip
            dist/dnsmgr_${{ steps.version.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Download verified package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Verify downloaded package
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum -c "dnsmgr_${VERSION}.zip.sha256"
          )

      - name: Create GitHub release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "dist/dnsmgr_${VERSION}.zip" \
            "dist/dnsmgr_${VERSION}.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "v${{ needs.build.outputs.upstream_version }} (fork ${VERSION})" \
            --generate-notes
